<!DOCTYPE html>
<html lang="zh-TW">
<meta name="referrer" content="strict-origin-when-cross-origin">
<head>
    <meta charset="UTF-8">
    <title>土風舞查詢系統</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        input[type="text"] { padding: 10px; width: 80%; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .results { margin-top: 20px; }
        .result-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .result-item:last-child { border-bottom: none; }
        .dance-title { margin: 0 0 5px 0; color: #2c3e50; }
        .dance-meta { font-size: 14px; color: #7f8c8d; margin-bottom: 8px; }
        .video-links { display: flex; gap: 15px; }
        .video-link { display: inline-block; color: #3498db; text-decoration: none; font-size: 15px; }
        .video-link:hover { text-decoration: underline; color: #2980b9; }
        .no-video { color: #95a5a6; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>土風舞影片查詢</h1>
        <p>請輸入舞碼名稱的一部分進行模糊查詢：</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="輸入舞碼名稱（例如：以色列、水舞...）">
            <button onclick="searchDance()">查詢</button>
        </div>
        
        <div class="results" id="resultsArea">
            <p style="color: #7f8c8d;">資料載入中，請稍候...</p>
        </div>
    </div>

    <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZ-wh4egGjN5qyGd8BBkUo5U124DAgxOoJcczFyRWy4c-W-cIBQlVy2XbMZ5PzyJk_Eg/exec';
    let allDances = [];

    // 網頁載入時自動從 Google Apps Script 取得資料
    async function fetchDances() {
        try {
            const response = await fetch(WEB_APP_URL);
            allDances = await response.json();
            document.getElementById('resultsArea').innerHTML = '<p style="color: #27ae60;">資料載入完成！請輸入舞碼進行查詢。</p>';
        } catch (error) {
            document.getElementById('resultsArea').innerHTML = '<p style="color:#e74c3c;">無法載入資料，請檢查網路連線或確認 Google 專案是否已發布為「任何人」皆可存取。</p>';
        }
    }

    // 執行模糊查詢與畫面渲染
    function searchDance() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultsArea = document.getElementById('resultsArea');
        
        // 如果使用者沒有輸入任何關鍵字，提示輸入
        if (query === '') {
            resultsArea.innerHTML = '<p style="color:#e67e22;">請輸入舞碼關鍵字再進行查詢。</p>';
            return;
        }

        // 篩選出符合關鍵字的舞碼（比對 danceName 欄位）
        const filteredDances = allDances.filter(dance => {
            const name = dance.danceName ? dance.danceName.toLowerCase() : '';
            return name.includes(query);
        });

        // 檢查是否有搜尋結果
        if (filteredDances.length === 0) {
            resultsArea.innerHTML = '<p style="color: #7f8c8d;">找不到符合的舞碼影片。</p>';
            return;
        }

        // 動態生成 HTML 結構
        let htmlContent = '';
        filteredDances.forEach(dance => {
            // 建立影片連結的 HTML（可能包含 video1 或 video2）
            let videoHtml = '';
            if (dance.video1) {
                videoHtml += `<a class="video-link" href="${dance.video1}" target="_blank">🎬 影片連結 1</a>`;
            }
            if (dance.video2) {
                videoHtml += `<a class="video-link" href="${dance.video2}" target="_blank">🎬 影片連結 2</a>`;
            }
            if (!videoHtml) {
                videoHtml = '<span class="no-video">⚠️ 暫無影片連結</span>';
            }

            // 組合單一舞碼的顯示內容，並加入國家與隊形資訊
            htmlContent += `
                <div class="result-item">
                    <h3 class="dance-title">${dance.danceName || '未命名舞碼'}</h3>
                    <div class="dance-meta">
                        <span>🌍 國家：${dance.country || '不詳'}</span> | 
                        <span>💃 隊形：${dance.form || '不詳'}</span>
                    </div>
                    <div class="video-links">
                        ${videoHtml}
                    </div>
                </div>
            `;
        });

        // 將結果渲染至網頁上
        resultsArea.innerHTML = htmlContent;
    }

    // 讓使用者按 Enter 鍵也能直接觸發查詢
    document.getElementById('searchInput').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            searchDance();
        }
    });

    // 頁面載入完成後立即執行資料抓取
    window.onload = fetchDances;
    </script>
</body>
</html>
